{% extends 'base.html' %}
{% block title %}Register - Trade Buddy{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto bg-white rounded-lg shadow p-6">
  <h1 class="text-xl font-semibold mb-4">Create Account</h1>
  <form method="post" class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div>
      <label class="block text-sm mb-1">Full name</label>
      <input name="full_name" class="w-full border rounded px-3 py-2" required />
    </div>
    <div>
      <label class="block text-sm mb-1">Email</label>
      <input type="email" name="email" class="w-full border rounded px-3 py-2" required />
    </div>
    <div>
      <label class="block text-sm mb-1">Password</label>
      <input type="password" name="password" class="w-full border rounded px-3 py-2" required />
    </div>
    <div>
      <label class="block text-sm mb-1">Max trades/day</label>
      <input type="number" name="max_trad_per_day" value="5" min="1" max="100" class="w-full border rounded px-3 py-2" />
    </div>
    <div>
      <label class="block text-sm mb-1">Base stoploss %</label>
      <input type="number" step="0.1" name="base_stoploss" value="5.0" class="w-full border rounded px-3 py-2" />
    </div>
    <div>
      <label class="block text-sm mb-1">Base target %</label>
      <input type="number" step="0.1" name="base_target" value="10.0" class="w-full border rounded px-3 py-2" />
    </div>
    <div class="flex items-center gap-2">
      <input type="checkbox" name="trailing_status" checked class="h-4 w-4" />
      <label class="text-sm">Enable trailing</label>
    </div>
    <div>
      <label class="block text-sm mb-1">Trailing stoploss %</label>
      <input type="number" step="0.1" name="trailing_stoploss" value="10.0" class="w-full border rounded px-3 py-2" />
    </div>
    <div>
      <label class="block text-sm mb-1">Trailing target %</label>
      <input type="number" step="0.1" name="trailing_target" value="10.0" class="w-full border rounded px-3 py-2" />
    </div>
    <div class="md:col-span-2">
      <label class="block text-sm mb-1">Description</label>
      <input name="description" value="Trade Buddy User" class="w-full border rounded px-3 py-2" />
    </div>
    <div class="md:col-span-2">
      <button class="w-full bg-slate-900 text-white py-2 rounded">Create account</button>
    </div>
  </form>
</div>
{% endblock %}
